name: Daily arXiv paper collection

on:
  schedule:
    # Run daily at 17:30 KST, away from GitHub Actions' peak load at the top of the hour.
    - cron: '30 17 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}
      commit_hash: ${{ steps.auto-commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Collect papers
        run: node scripts/collect-papers.mjs
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_TIMEOUT_MS: '60000'
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

      - name: Commit and push if changed
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'auto: update arXiv paper data'
          commit_user_name: 'arXiv Collector Bot'
          commit_user_email: 'bot@arxiv-collector.local'
          file_pattern: data/papers.js

  notify:
    name: Send ntfy notification
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Publish collection result
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESULT: ${{ needs.collect.result }}
          CHANGES_DETECTED: ${{ needs.collect.outputs.changes_detected }}
          COMMIT_HASH: ${{ needs.collect.outputs.commit_hash }}
          SITE_URL: https://mincia1110.github.io/Study-ML/
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::NTFY_TOPIC secret is not configured"
            exit 1
          fi

          if [ "$RESULT" = "success" ]; then
            title="Study-ML collection succeeded"
            tags="heavy_check_mark,books"
            priority="default"
          else
            title="Study-ML collection ${RESULT}"
            tags="warning,books"
            priority="high"
          fi

          message="Result: ${RESULT}
          Data changed: ${CHANGES_DETECTED:-unknown}
          Commit: ${COMMIT_HASH:-none}
          Site: ${SITE_URL}"

          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --output /dev/null \
            -H "Title: ${title}" \
            -H "Tags: ${tags}" \
            -H "Priority: ${priority}" \
            -H "Click: ${SITE_URL}" \
            --data-binary "$message" \
            "https://ntfy.sh/${NTFY_TOPIC}"
